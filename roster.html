<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Current Members — Phoenix League</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/phoenix-league-logo-favicon.svg">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="roster">
<div data-include="partials/nav.html"></div>

<section class="hero">
  <div class="wrap">
    <h1>Current Members</h1>
    <p>The managers competing this season.</p>
  </div>
</section>

<main class="wrap">
  <section id="group-photo-section">
    <img class="group-photo" id="group-photo-img" src="assets/photos/group-photo.jpg" alt="League group photo" style="display:none;">
    <div class="group-photo-placeholder" id="group-photo-fallback">
      Group photo coming soon &mdash; drop the annual draft-day photo in as
      <code>assets/photos/group-photo.jpg</code> and it'll show up here automatically.
    </div>
  </section>

  <select class="sort-select" id="roster-sort">
    <option value="tenure">Sort by: Tenure (longest first)</option>
    <option value="wins">Sort by: Career Wins</option>
    <option value="winpct">Sort by: Win %</option>
    <option value="championships">Sort by: Championships</option>
    <option value="alpha">Sort by: Name (A-Z)</option>
  </select>
  <section id="roster-grid" class="grid"></section>
</main>

<footer class="site-footer"><div class="wrap">Phoenix League &middot; site structure in progress</div></footer>

<script src="js/include.js"></script>
<script src="js/data.js"></script>
<script>
// Group photo: only show the <img> if it actually loads, otherwise
// leave the placeholder text visible (already the default state).
(function () {
  const img = document.getElementById('group-photo-img');
  const fallback = document.getElementById('group-photo-fallback');
  img.addEventListener('load', () => { img.style.display = ''; fallback.style.display = 'none'; });
  img.addEventListener('error', () => { img.style.display = 'none'; fallback.style.display = ''; });
})();

(async function () {
  const managers = (await loadManagers()).filter(m => m.status === 'current');
  const grid = document.getElementById('roster-grid');

  function render(sorted) {
    grid.innerHTML = sorted.map(m => `<div class="card">
      ${avatarHTML(m)}
      <h3>${m.display_name}</h3>
      <p class="meta">Since ${Math.min(...m.years_active)}</p>
      <p class="stat-line">${m.career.wins}-${m.career.losses} (${pct(m.career.win_pct)})</p>
      <p class="stat-line">${m.career.championships} championship${m.career.championships === 1 ? '' : 's'}
         &middot; ${m.career.championship_appearances} title game${m.career.championship_appearances === 1 ? '' : 's'}
         (${m.career.runner_up_finishes} runner-up)</p>
      <p class="stat-line">Playoffs: ${m.career.playoff_appearances}/${m.years_active.length} seasons</p>
      <p class="stat-line">Best: ${ordinal(m.career.best_finish)} &middot; Worst: ${ordinal(m.career.worst_finish)}</p>
    </div>`).join('');
  }

  const sorters = {
    tenure: (a, b) => Math.min(...a.years_active) - Math.min(...b.years_active),
    wins: (a, b) => b.career.wins - a.career.wins,
    winpct: (a, b) => b.career.win_pct - a.career.win_pct,
    championships: (a, b) => b.career.championships - a.career.championships,
    alpha: (a, b) => a.display_name.localeCompare(b.display_name),
  };

  render([...managers].sort(sorters.tenure));

  document.getElementById('roster-sort').addEventListener('change', (e) => {
    render([...managers].sort(sorters[e.target.value]));
  });
})();
</script>
</body>
</html>
